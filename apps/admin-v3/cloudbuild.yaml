steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "$_IMAGE",
        "--build-arg",
        "VITE_PRIVY_APP_ID=$_VITE_PRIVY_APP_ID",
        "--build-arg",
        "VITE_DEMO_LITE_API_BASE_URL=$_VITE_DEMO_LITE_API_BASE_URL",
        ".",
      ]
images:
  - "$_IMAGE"

options:
  machineType: "E2_HIGHCPU_8"

substitutions:
  _IMAGE: "us-central1-docker.pkg.dev/one-491501/cloud-run-source-deploy/810-admin-v3:latest"
  _VITE_PRIVY_APP_ID: ""
  _VITE_DEMO_LITE_API_BASE_URL: "https://banco-demo-lite-422728451591.us-central1.run.app"

